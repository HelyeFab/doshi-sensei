<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #4F46E5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #1F2937;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .status.success {
      background: #D1FAE5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }
    .status.error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }
    .status.info {
      background: #DBEAFE;
      color: #1E40AF;
      border: 1px solid #BFDBFE;
    }
    button {
      width: 100%;
      padding: 10px 16px;
      background: #4F46E5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background: #4338CA;
    }
    button:disabled {
      background: #9CA3AF;
      cursor: not-allowed;
    }
    .caption-info {
      font-size: 13px;
      color: #6B7280;
      margin-top: 8px;
    }
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #4F46E5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">DS</div>
    <h1>Doshi Sensei Helper</h1>
  </div>
  
  <div id="status" class="status info">
    Checking YouTube page...
  </div>
  
  <button id="extractBtn" disabled>Extract Captions</button>
  <button id="openDoshiBtn" disabled>Open in Doshi Sensei</button>
  
  <div id="captionInfo" class="caption-info"></div>
  
  <script src="popup.js"></script>
</body>
</html>
