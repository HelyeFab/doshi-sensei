apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: doshi-sensei
  labels:
    app: doshi-sensei
    component: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: doshi-sensei
      component: postgres
  template:
    metadata:
      labels:
        app: doshi-sensei
        component: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "doshi_sensei"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: doshi-sensei-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: doshi-sensei-secrets
              key: DB_PASSWORD
        - name: POSTGRES_MAX_CONNECTIONS
          value: "100"
        - name: POSTGRES_SHARED_BUFFERS
          value: "256MB"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: doshi-sensei
  labels:
    app: doshi-sensei
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: doshi-sensei
    component: postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  clusterIP: None

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: doshi-sensei
data:
  01-init-db.sql: |
    -- Create reviews table
    CREATE TABLE IF NOT EXISTS reviews (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id VARCHAR(255) NOT NULL,
      item_id VARCHAR(255) NOT NULL,
      source_type VARCHAR(50) NOT NULL,
      content_type VARCHAR(50) NOT NULL,
      result JSONB NOT NULL,
      duration_ms INTEGER,
      next_review_date TIMESTAMP WITH TIME ZONE,
      interval_days INTEGER,
      ease_factor DECIMAL(3,2),
      repetitions INTEGER DEFAULT 0,
      lapses INTEGER DEFAULT 0,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      reviewed_at TIMESTAMP WITH TIME ZONE,
      sync_version INTEGER DEFAULT 1
    );
    
    -- Create indexes
    CREATE INDEX IF NOT EXISTS idx_user_due ON reviews(user_id, next_review_date);
    CREATE INDEX IF NOT EXISTS idx_source_item ON reviews(source_type, item_id);
    CREATE INDEX IF NOT EXISTS idx_sync ON reviews(user_id, sync_version, updated_at);
    
    -- Create review_events table
    CREATE TABLE IF NOT EXISTS review_events (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      event_type VARCHAR(50) NOT NULL,
      user_id VARCHAR(255),
      event_data JSONB NOT NULL,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      processed_at TIMESTAMP WITH TIME ZONE
    );
    
    -- Create indexes for events
    CREATE INDEX IF NOT EXISTS idx_user_events ON review_events(user_id, created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_unprocessed ON review_events(processed_at) WHERE processed_at IS NULL;
    
    -- Create sync_status table
    CREATE TABLE IF NOT EXISTS sync_status (
      user_id VARCHAR(255) PRIMARY KEY,
      last_sync_at TIMESTAMP WITH TIME ZONE,
      sync_version INTEGER DEFAULT 0,
      pending_changes INTEGER DEFAULT 0,
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    
    -- Create performance metrics table
    CREATE TABLE IF NOT EXISTS performance_metrics (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      metric_name VARCHAR(100) NOT NULL,
      metric_value DECIMAL,
      tags JSONB,
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    
    CREATE INDEX IF NOT EXISTS idx_metrics_time ON performance_metrics(created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_metrics_name ON performance_metrics(metric_name, created_at DESC);