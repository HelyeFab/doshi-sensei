apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-deployment
  namespace: doshi-sensei
  labels:
    app: doshi-sensei
    component: websocket
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: doshi-sensei
      component: websocket
  template:
    metadata:
      labels:
        app: doshi-sensei
        component: websocket
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - websocket
              topologyKey: kubernetes.io/hostname
      containers:
      - name: websocket
        image: doshi-sensei-websocket:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: ws
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: doshi-sensei-secrets
              key: REDIS_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: doshi-sensei-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: doshi-sensei-secrets
              key: JWT_SECRET
        - name: WS_HEARTBEAT_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: doshi-sensei-config
              key: WS_HEARTBEAT_INTERVAL
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: websocket-service
  namespace: doshi-sensei
  labels:
    app: doshi-sensei
    component: websocket
spec:
  type: ClusterIP
  selector:
    app: doshi-sensei
    component: websocket
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: websocket
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 86400