# This is a template file. DO NOT commit actual secrets to version control!
# Use sealed-secrets or external secret management in production
apiVersion: v1
kind: Secret
metadata:
  name: doshi-sensei-secrets
  namespace: doshi-sensei
type: Opaque
stringData:
  # Firebase Configuration
  NEXT_PUBLIC_FIREBASE_API_KEY: "your-firebase-api-key"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "your-project.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "your-project-id"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "your-project.appspot.com"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "your-sender-id"
  NEXT_PUBLIC_FIREBASE_APP_ID: "your-app-id"
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "your-measurement-id"
  
  # Firebase Admin
  FIREBASE_ADMIN_CLIENT_EMAIL: "firebase-adminsdk@your-project.iam.gserviceaccount.com"
  FIREBASE_ADMIN_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nyour-private-key\n-----END PRIVATE KEY-----"
  
  # Database
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/doshi_sensei"
  DB_USER: "doshi"
  DB_PASSWORD: "your-secure-password"
  
  # Redis
  REDIS_PASSWORD: "your-redis-password"
  REDIS_URL: "redis://:your-redis-password@redis-service:6379"
  
  # JWT for WebSocket
  JWT_SECRET: "your-jwt-secret-key"
  
  # External APIs
  SUPA_YOUTUBE_API_KEY: "your-supadata-api-key"
  
  # Session Secret
  SESSION_SECRET: "your-session-secret"