[build]
  command = "npm install && node scripts/setup-kuromoji.js && CI=false SKIP_TYPE_CHECK=true npm run build"
  publish = ".next"
  functions = "netlify/functions"
  environment = { NODE_VERSION = "20" }

[[plugins]]
  package = "@netlify/plugin-nextjs"

# PWA Headers
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for flat-icons SVGs
[[headers]]
  for = "/flat-icons/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/flat-icons/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

# Serve static files before the catch-all redirect
# IMPORTANT: Serve flat-icons as static files (no redirect)
# This must come before any catch-all rules
[[redirects]]
  from = "/flat-icons/*"
  to = "/flat-icons/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*.svg"
  to = "/:splat.svg"
  status = 200
  force = false

[[redirects]]
  from = "/*.png"
  to = "/:splat.png"
  status = 200
  force = false

[[redirects]]
  from = "/*.ico"
  to = "/:splat.ico"
  status = 200
  force = false

# Next.js specific paths
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

# Catch-all redirect for SPA (should be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled Functions
[functions]
  # Daily news scraping - runs at 6 AM JST (9 PM UTC previous day)
  # DISABLED: Using enhanced version instead (was fetching English content from todaiinews.com)
  # [functions."scrape-news-scheduled"]
  #   schedule = "0 21 * * *"
  
  # Enhanced daily news scraping with all 6 sources
  [functions."scrape-news-scheduled-enhanced"]
    schedule = "0 21 * * *"
  
  # Puppeteer-based scraper configurations with increased memory
  [functions."scrape-nhk-easy-puppeteer"]
    memory = 1024
  
  [functions."scrape-todaii-puppeteer"]
    memory = 1024
  
  [functions."scrape-watanoc-puppeteer"]
    memory = 1024
  
  [functions."scrape-nhk-improved"]
    memory = 1024
  
  [functions."scrape-yahoo-news"]
    memory = 1024
  
  [functions."scrape-mainichi-shogakusei"]
    memory = 1024
  
  [functions."scrape-mainichi-news"]
    memory = 1024
  
  # Alternative times if you want multiple daily scrapes:
  # Morning scrape at 6 AM JST (9 PM UTC)
  # [functions."scrape-news-morning"]
  #   schedule = "0 21 * * *"
  
  # Evening scrape at 6 PM JST (9 AM UTC)
  # [functions."scrape-news-evening"]
  #   schedule = "0 9 * * *"

# Note: The scrape-news-scheduled function supports both HTTP and scheduled triggers

# Development server configuration
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3002
  autoLaunch = false
