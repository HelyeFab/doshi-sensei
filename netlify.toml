[build]
  command = "npm ci && npm run build"
  publish = ".next"
  functions = "netlify/functions"
  environment = { NODE_VERSION = "20", NEXT_TELEMETRY_DISABLED = "1" }

[[plugins]]
  package = "@netlify/plugin-nextjs"


# Form handling configuration
# Note: Netlify doesn't support forms configuration in netlify.toml
# Forms are detected automatically from HTML with data-netlify="true"
# Email notifications must be configured in the Netlify UI under:
# Site settings > Forms > Form notifications

# Performance Headers for LCP optimization
[[headers]]
  for = "/"
  [headers.values]
    Link = '''
    </fonts/Rubik/static/Rubik-Regular.ttf>; rel=preload; as=font; type=font/ttf; crossorigin,
    </fonts/Geist/Geist-VariableFont_wght.ttf>; rel=preload; as=font; type=font/ttf; crossorigin,
    <https://firebaseio.com>; rel=preconnect,
    <https://firestore.googleapis.com>; rel=preconnect
    '''
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Critical: Next.js chunk headers to prevent Chrome caching issues
[[headers]]
  for = "/_next/static/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/_next/static/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Build manifest should not be cached long
[[headers]]
  for = "/_next/static/*/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# PWA Headers
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/x-icon"

# Headers for flat-icons SVGs
[[headers]]
  for = "/flat-icons/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/flat-icons/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

# Serve static files before the catch-all redirect
# IMPORTANT: Serve flat-icons as static files (no redirect)
# This must come before any catch-all rules
[[redirects]]
  from = "/flat-icons/*"
  to = "/flat-icons/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*.svg"
  to = "/:splat.svg"
  status = 200
  force = false

[[redirects]]
  from = "/*.png"
  to = "/:splat.png"
  status = 200
  force = false

[[redirects]]
  from = "/*.ico"
  to = "/:splat.ico"
  status = 200
  force = false

# Next.js specific paths
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200
  force = false

# Scheduled Functions
[functions]
  # Daily news scraping - runs at 6 AM JST (9 PM UTC previous day)
  # DISABLED: Using enhanced version instead (was fetching English content from todaiinews.com)
  # [functions."scrape-news-scheduled"]
  #   schedule = "0 21 * * *"
  
  # Enhanced daily news scraping with all 6 sources
  [functions."scrape-news-scheduled-enhanced"]
    schedule = "0 21 * * *"
  
  # AI validation for scraped articles - runs hourly
  [functions."validate-articles-scheduled"]
    schedule = "0 * * * *"
  
  # Puppeteer-based scraper configurations with increased memory
  [functions."scrape-nhk-easy-puppeteer"]
    memory = 1024
  
  [functions."scrape-todaii-puppeteer"]
    memory = 1024
  
  [functions."scrape-watanoc-puppeteer"]
    memory = 1024
  
  [functions."scrape-nhk-improved"]
    memory = 1024
  
  [functions."scrape-yahoo-news"]
    memory = 1024
  
  [functions."scrape-mainichi-shogakusei"]
    memory = 1024
  
  [functions."scrape-mainichi-news"]
    memory = 1024
  
  # Alternative times if you want multiple daily scrapes:
  # Morning scrape at 6 AM JST (9 PM UTC)
  # [functions."scrape-news-morning"]
  #   schedule = "0 21 * * *"
  
  # Evening scrape at 6 PM JST (9 AM UTC)
  # [functions."scrape-news-evening"]
  #   schedule = "0 9 * * *"

# Note: The scrape-news-scheduled function supports both HTTP and scheduled triggers

# Development server configuration
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3002
  autoLaunch = false
