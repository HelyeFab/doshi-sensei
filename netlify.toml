[build]
  command = "npm install && node scripts/setup-kuromoji.js && CI=false SKIP_TYPE_CHECK=true npm run build"
  publish = ".next"
  functions = "netlify/functions"
  environment = { NODE_VERSION = "20" }

# PWA Headers
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for flat-icons SVGs
[[headers]]
  for = "/flat-icons/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/flat-icons/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

# Serve static files before the catch-all redirect
[[redirects]]
  from = "/flat-icons/*"
  to = "/flat-icons/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*.svg"
  to = "/:splat.svg"
  status = 200
  force = false

[[redirects]]
  from = "/*.png"
  to = "/:splat.png"
  status = 200
  force = false

[[redirects]]
  from = "/*.ico"
  to = "/:splat.ico"
  status = 200
  force = false

# Next.js specific paths
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

# Catch-all redirect for SPA (should be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled Functions
# Article cleanup runs every day at 2 AM UTC (disabled - function doesn't exist)
# [functions]
#   [functions."article-cleanup"]
#     schedule = "0 2 * * *"

# Development server configuration
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3002
  autoLaunch = false

# Functions are now HTTP endpoints, not scheduled
