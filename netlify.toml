[build]
  command = "npm install && CI=false SKIP_TYPE_CHECK=true npm run build"
  publish = ".next"
  functions = "netlify/functions"
  environment = { NODE_VERSION = "20" }

# PWA Headers
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled Functions
# Article cleanup runs every day at 2 AM UTC (disabled - function doesn't exist)
# [functions]
#   [functions."article-cleanup"]
#     schedule = "0 2 * * *"

[functions]
  # Scrape NHK Easy articles every morning at 6 AM UTC (3 PM JST)
  [functions."scrape-nhk-easy"]
    schedule = "0 6 * * *"

  # Scrape Todaii News articles every morning at 6:30 AM UTC
  [functions."scrape-todaii-news"]
    schedule = "30 6 * * *"

  # Scrape Watanoc articles every morning at 7 AM UTC
  [functions."scrape-watanoc-working"]
    schedule = "0 7 * * *"
