<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doshi Sensei - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            opacity: 0.3;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .button:hover {
            background-color: #0056b3;
        }
        
        .cached-content {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #e0e0e0;
        }
        
        .cached-content h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #333;
        }
        
        .cached-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .cached-list li {
            margin-bottom: 0.5rem;
        }
        
        .cached-list a {
            color: #007bff;
            text-decoration: none;
        }
        
        .cached-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        
        <h1>You're Offline</h1>
        
        <p>
            It looks like you've lost your internet connection. 
            Don't worry - you can still access any content you've previously viewed while online.
        </p>
        
        <a href="#" class="button" onclick="window.location.reload()">Try Again</a>
        
        <div class="cached-content">
            <h2>Available Offline</h2>
            <ul class="cached-list" id="cachedContent">
                <li>Loading cached content...</li>
            </ul>
        </div>
    </div>
    
    <script>
        // Check for cached content
        async function loadCachedContent() {
            const cachedList = document.getElementById('cachedContent');
            
            try {
                // Get cached pages from service worker
                const cache = await caches.open('dynamic-cache-v1');
                const requests = await cache.keys();
                
                if (requests.length === 0) {
                    cachedList.innerHTML = '<li>No cached content available</li>';
                    return;
                }
                
                cachedList.innerHTML = '';
                
                // Filter and display cached pages
                requests
                    .filter(request => {
                        const url = new URL(request.url);
                        return url.pathname !== '/' && 
                               url.pathname !== '/offline.html' &&
                               !url.pathname.startsWith('/api/');
                    })
                    .slice(0, 10) // Show max 10 items
                    .forEach(request => {
                        const url = new URL(request.url);
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = url.pathname;
                        a.textContent = url.pathname.replace(/\//g, ' › ').trim() || 'Home';
                        li.appendChild(a);
                        cachedList.appendChild(li);
                    });
                    
                if (cachedList.children.length === 0) {
                    cachedList.innerHTML = '<li>No cached pages available</li>';
                }
            } catch (error) {
                console.error('Failed to load cached content:', error);
                cachedList.innerHTML = '<li>Unable to load cached content</li>';
            }
        }
        
        // Load cached content when page loads
        loadCachedContent();
        
        // Listen for online event
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
